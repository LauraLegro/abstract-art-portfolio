<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Photography Gallery</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: #080812;
            color: white;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        html {
            scroll-behavior: smooth;
        }

        /* Abstract Background */

        .background {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(circle at 15% 20%, #ff4fd8 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, #00d4ff 0%, transparent 25%),
                radial-gradient(circle at 50% 80%, #8b5cf6 0%, transparent 30%),
                #080812;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .35;
            animation: float 14s infinite ease-in-out;
        }

        .blob:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #ff4fd8;
            top: 10%;
            left: 10%;
        }

        .blob:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #00d4ff;
            top: 40%;
            right: 10%;
        }

        .blob:nth-child(3) {
            width: 250px;
            height: 250px;
            background: #8b5cf6;
            bottom: 10%;
            left: 40%;
        }

        @keyframes float {
            50% {
                transform: translateY(-50px) translateX(30px);
            }
        }

        /* Hero */

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .hero h1 {
            font-size: clamp(4rem, 10vw, 9rem);
            line-height: .9;
            letter-spacing: -4px;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 700px;
            margin: auto;
            color: #d0d0d0;
            font-size: 1.2rem;
        }

        /* Gallery */

        .gallery-section {
            padding: 100px 8%;
        }

        .gallery {
            columns: 3 300px;
            column-gap: 20px;
        }

        .photo {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            cursor: pointer;
        }

        .photo img {
            width: 100%;
            display: block;
            transition: transform .8s ease;
        }

        .photo:hover img {
            transform: scale(1.08);
        }

        .photo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent,
                    rgba(0, 0, 0, .5));
            opacity: 0;
            transition: .4s;
        }

        .photo:hover::after {
            opacity: 1;
        }

        .caption {
            position: absolute;
            left: 20px;
            bottom: 20px;
            z-index: 2;
            opacity: 0;
            transform: translateY(20px);
            transition: .4s;
        }

        .photo:hover .caption {
            opacity: 1;
            transform: translateY(0);
        }

        .parallax {
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .photo {
            transform: translateY(0);
            transition:
                transform .2s linear,
                box-shadow .4s ease;
        }

        .photo:hover {
            box-shadow:
                0 20px 60px rgba(0, 212, 255, .15),
                0 20px 60px rgba(255, 79, 216, .15);
        }

        /* Footer */

        footer {
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <div class=" blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>

    <section class="hero hero-content parallax">
        <div>
            <h1>ABSTRACT<br>VISIONS</h1>
            <p>
                A collection of photographs exploring light,
                texture, movement, and emotion through an
                abstract artistic lens.
            </p>
        </div>
    </section>

    <section class="gallery-section">

        <div class="gallery">

            <div class="photo parallax">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1200" alt="">
                <div class="caption">Dreamscape</div>
            </div>

            <div class="photo parallax">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1200" alt="">
                <div class="caption">Fluid Light</div>
            </div>

            <div class="photo parallax">
                <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=1200" alt="">
                <div class="caption">Chromatic Motion</div>
            </div>

            <div class="photo parallax">
                <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=1200" alt="">
                <div class="caption">Fragments</div>
            </div>

            <div class="photo parallax">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200" alt="">
                <div class="caption">Ethereal Form</div>
            </div>

            <div class="photo parallax">
                <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1200" alt="">
                <div class="caption">Silent Color</div>
            </div>

        </div>

    </section>

    <footer>
        Photography Portfolio • Abstract Art Inspired Design
    </footer>

    <script>
        const parallaxItems =
            document.querySelectorAll('.parallax');

        let currentScroll = 0;
        let targetScroll = 0;

        function smoothScroll() {

            targetScroll =
                window.pageYOffset;

            currentScroll +=
                (targetScroll - currentScroll)
                * 0.08;

            parallaxItems.forEach(item => {

                const speed =
                    parseFloat(
                        item.dataset.speed
                    ) || 0.1;

                const y =
                    currentScroll * speed;

                item.style.transform =
                    `translate3d(0,${y}px,0)`;
            });

            requestAnimationFrame(
                smoothScroll
            );
        }

        smoothScroll();
    </script>
</body>

</html>
